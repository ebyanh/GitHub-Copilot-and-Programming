services:
  - type: web
    name: muse
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: muse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MUSE_SECRET_KEY
        generateValue: true
      - key: MUSE_COOKIE_SECURE
        value: "1"
      - key: MUSE_DATABASE
        value: /var/data/muse.db
      - key: MUSE_UPLOAD_DIR
        value: /var/data/uploads
      - key: MUSE_SMTP_HOST
        sync: false
      - key: MUSE_SMTP_PORT
        value: "587"
      - key: MUSE_SMTP_USERNAME
        sync: false
      - key: MUSE_SMTP_PASSWORD
        sync: false
      - key: MUSE_SMTP_FROM
        sync: false
